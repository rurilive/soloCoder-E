[project]
name = "ereader"
version = "0.1.0"
description = "A web-based e-book reader"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "ebooklib",
    "beautifulsoup4",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py38"
