<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}密码本管理器{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">🔐 密码本管理器</h1>
                {% if request.url.path not in ['/login', '/setup', '/'] %}
                <nav class="nav">
                    <a href="/dashboard" class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}">
                        首页
                    </a>
                    <a href="/add" class="nav-link {% if request.url.path == '/add' %}active{% endif %}">
                        添加密码
                    </a>
                    <a href="/lock" class="nav-link nav-link-danger">
                        锁定
                    </a>
                </nav>
                {% endif %}
            </div>
        </header>
        
        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
        
        <footer class="footer">
            <p>密码本管理器 &copy; 2024 - 安全存储您的所有密码</p>
        </footer>
    </div>
    
    {% block scripts %}
    {% endblock %}
</body>
</html>
