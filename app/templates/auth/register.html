{% extends "base.html" %}

{% block title %}注册 - 邻里互助平台{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">注册</h2>
                <form method="POST">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="username" name="username" required placeholder="请输入用户名">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">邮箱 <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="请输入邮箱">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="password" class="form-label">密码 <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码">
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">手机号</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="请输入手机号">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="community_id" class="form-label">选择小区</label>
                        <select class="form-select" id="community_id" name="community_id">
                            <option value="">-- 请选择小区 --</option>
                            {% for community in communities %}
                            <option value="{{ community.id }}">{{ community.name }} ({{ community.city or '' }})</option>
                            {% endfor %}
                        </select>
                        <small class="text-muted">如果您的小区不在列表中，您可以在注册后创建新小区</small>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">注册</button>
                    </div>
                </form>
                <hr class="my-4">
                <div class="text-center">
                    <p class="text-muted mb-0">已有账号？
                        <a href="{{ url_for('auth.login') }}">立即登录</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
