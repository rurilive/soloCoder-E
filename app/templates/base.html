<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}会议系统{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">会议系统</a>
            <div class="nav-links">
                <a href="/conference/" class="nav-link">会议大厅</a>
                {% if user %}
                <a href="/recording/" class="nav-link">我的录制</a>
                <span class="nav-user">{{ user.display_name or user.username }}</span>
                <a href="/auth/logout" class="nav-link">退出登录</a>
                {% else %}
                <a href="/auth/login" class="nav-link">登录</a>
                <a href="/auth/register" class="nav-link">注册</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
