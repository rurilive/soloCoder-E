[project]
name = "neighborhood-helper"
version = "0.1.0"
description = "邻里互助平台 - 拼团买菜、借工具、遛狗互助"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "jinja2>=3.1.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    "flask-sqlalchemy>=3.0.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2.1",
    "werkzeug>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.uv]
python-preference = "only-managed"
