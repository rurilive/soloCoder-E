<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独游戏</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>数独游戏</h1>
            <p class="subtitle">填充数字 1-9，使每行、每列和每个 3×3 宫格都包含所有数字</p>
        </header>

        <div class="game-controls">
            <div class="difficulty-selector">
                <label for="difficulty">难度：</label>
                <select id="difficulty" name="difficulty">
                    <option value="easy" {% if difficulty == 'easy' %}selected{% endif %}>简单</option>
                    <option value="medium" {% if difficulty == 'medium' %}selected{% endif %}>中等</option>
                    <option value="hard" {% if difficulty == 'hard' %}selected{% endif %}>困难</option>
                    <option value="expert" {% if difficulty == 'expert' %}selected{% endif %}>专家</option>
                </select>
            </div>

            <div class="button-group">
                <button id="new-game-btn" class="btn btn-primary">新游戏</button>
                <button id="validate-btn" class="btn btn-secondary">验证答案</button>
                <button id="hint-btn" class="btn btn-warning">提示</button>
                <button id="export-btn" class="btn btn-info">复制答案</button>
                <button id="reset-btn" class="btn btn-danger">重置</button>
            </div>
        </div>

        <div class="sudoku-container">
            <div class="sudoku-grid" id="sudoku-grid">
                {% for i in range(9) %}
                    {% for j in range(9) %}
                        <input
                            type="text"
                            class="sudoku-cell"
                            data-row="{{ i }}"
                            data-col="{{ j }}"
                            maxlength="1"
                            inputmode="numeric"
                            {% if initial_grid[i][j] != 0 %}
                                value="{{ initial_grid[i][j] }}"
                                readonly
                                class="sudoku-cell initial"
                            {% else %}
                                value="{% if grid[i][j] != 0 %}{{ grid[i][j] }}{% endif %}"
                            {% endif %}
                        >
                    {% endfor %}
                {% endfor %}
            </div>
        </div>

        <div class="number-pad" id="number-pad">
            <button class="number-btn" data-value="1">1</button>
            <button class="number-btn" data-value="2">2</button>
            <button class="number-btn" data-value="3">3</button>
            <button class="number-btn" data-value="4">4</button>
            <button class="number-btn" data-value="5">5</button>
            <button class="number-btn" data-value="6">6</button>
            <button class="number-btn" data-value="7">7</button>
            <button class="number-btn" data-value="8">8</button>
            <button class="number-btn" data-value="9">9</button>
            <button class="number-btn" data-value="">清除</button>
        </div>

        <div class="message-container" id="message-container"></div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
